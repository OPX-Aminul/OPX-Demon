# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
android.useAndroidX=true

# Automatically convert third-party libraries built with the old Android Support
# Library to use AndroidX artifacts (required for chrome-tabs -> android-util dependency)
android.enableJetifier=true

# --- OPX-Demon release signing -----------------------------------------------
# Self-signed release key shipped in the repo (keystore/opx-demon-release.jks).
# Store file is relative to the :app project dir, so it resolves to
# <repo>/keystore/opx-demon-release.jks. Override any of these via environment
# variables or -P flags when building outside this repository.
OPX_DEMON_RELEASE_STORE_FILE=../keystore/opx-demon-release.jks
OPX_DEMON_RELEASE_STORE_PASSWORD=7e7ce8b8687259f0cd09917cee0c07f7
OPX_DEMON_RELEASE_KEY_ALIAS=opx-demon-release
OPX_DEMON_RELEASE_KEY_PASSWORD=7e7ce8b8687259f0cd09917cee0c07f7


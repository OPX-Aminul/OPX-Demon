name: Build APK

# Builds a lightweight APK (without rootless binaries).
# Binaries are downloaded at runtime from the all-core-file release.

on:
  workflow_run:
    workflows: ["Build & Update Release"]
    types: [completed]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK (lightweight — no bundled binaries)
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleRelease

      - name: Create release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | grep -oP '[\"\x27]\K[0-9][^"]*')
          TAG="v${VERSION}"

          # Update an existing release first (keeps the curated release notes untouched)
          if gh release upload "$TAG" \
            app/build/outputs/apk/release/*.apk \
            --clobber; then
            echo "APK updated in existing release: $TAG"
            exit 0
          fi

          # Release does not exist yet: create it with generated notes
          # Do not overwrite notes on later builds so hand-written changelogs stay intact
          gh release create "$TAG" \
            --title "StrykerOSS $TAG" \
            --notes "StrykerOSS $TAG" \
            --generate-notes \
            --latest \
            app/build/outputs/apk/release/*.apk
          echo "APK release created: $TAG"

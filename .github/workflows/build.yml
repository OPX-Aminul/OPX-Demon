name: Build & Update Release

# Signing: release APK is signed with keystore/stryker-release.jks via
# gradle.properties (see README → Release signing).
# Exact match with original StrykerOSS rootless-main release
# Uses Debian Trixie stock kernel (NOT custom-compiled)
# Docker Buildx GHA cache: mode=max caches ALL layers for fast rebuilds
#
# A successful run also fires the Build APK workflow (workflow_run) for the
# version in app/build.gradle, which publishes the signed APK release.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'build-tools/**'
      - 'build-rootfs/**'
      - 'rootless-assets/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ══════════════════════════════════════════════════════════════════════
      # ROOTFS: Debian Trixie + pentest tools + stryker-agentd
      # ══════════════════════════════════════════════════════════════════════
      - name: Build rootfs
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rootfs-builder
          load: true
          tags: stryker-rootfs
          cache-from: type=gha,scope=rootfs
          cache-to: type=gha,scope=rootfs,mode=max

      - name: Extract rootfs + kernel + initrd
        run: |
          docker create --name rootfs-out stryker-rootfs
          docker cp rootfs-out:/work/rootfs.imgz ./rootfs.imgz
          docker cp rootfs-out:/work/Image ./Image
          docker cp rootfs-out:/work/initrd.img ./initrd.img
          docker rm rootfs-out
          echo "✅ All rootfs artifacts:"
          ls -lh ./rootfs.imgz ./Image ./initrd.img

      # ══════════════════════════════════════════════════════════════════════
      # QEMU: Cross-compiled patched QEMU binary
      # ══════════════════════════════════════════════════════════════════════
      - name: Build QEMU
        uses: docker/build-push-action@v6
        with:
          context: .
          target: qemu-builder
          load: true
          tags: stryker-qemu
          build-args: QEMU_VERSION=11.0.2
          cache-from: type=gha,scope=qemu
          cache-to: type=gha,scope=qemu,mode=max

      - name: Extract QEMU
        run: |
          docker create --name qemu-out stryker-qemu /bin/true
          docker cp qemu-out:/opt/qemu-out/qemu-system-aarch64 ./qemu-system-aarch64
          docker cp qemu-out:/opt/qemu-out/libslirp.so ./libslirp.so
          docker rm qemu-out
          echo "✅ QEMU + libslirp:"
          ls -lh ./qemu-system-aarch64 ./libslirp.so

      # ══════════════════════════════════════════════════════════════════════
      # UPLOAD: Replace files in all-core-file release
      # ══════════════════════════════════════════════════════════════════════
      - name: Upload to all-core-file release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload all-core-file \
            ./Image \
            ./initrd.img \
            ./rootfs.imgz \
            ./qemu-system-aarch64 \
            ./libslirp.so \
            --clobber

          echo ""
          echo "✅ Release updated:"
          gh release view all-core-file --json assets \
            --jq '.assets[] | "  \(.name) (\(.size / 1048576 * 100 | round / 100) MB)"'

      # ══════════════════════════════════════════════════════════════════════
      # SYNC: Re-pin rootless hashes in the manifest after every core rebuild.
      # The app downloads these five files at install time and validates them
      # against stryker_manifest.json (fetched from raw.githubusercontent.com).
      # If size/sha256 drift from what the pipeline just uploaded, the install
      # downloads a file to 100%, fails verification, and re-downloads the same
      # binary forever. Re-pin from the artifacts on every run.
      # ══════════════════════════════════════════════════════════════════════
      - name: Sync rootless manifest with uploaded artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          mapping = [
              ("qemu-system-aarch64", "qemu"),
              ("Image", "kernel"),
              ("initrd.img", "initrd"),
              ("libslirp.so", "libslirp"),
              ("rootfs.imgz", "rootfs"),
          ]
          with open("stryker_manifest.json") as fh:
              manifest = json.load(fh)
          rl = manifest["rootless"]
          for file_name, key in mapping:
              with open(file_name, "rb") as fh:
                  digest = hashlib.sha256(fh.read()).hexdigest()
              rl[key]["sha256"] = digest
              rl[key]["size"] = os.path.getsize(file_name)
              print(f"  {file_name}: {rl[key]['size']} bytes, sha256 {digest[:12]}…")
          with open("stryker_manifest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stryker_manifest.json
          if git diff --cached --quiet; then
            echo "✅ Manifest already in sync — nothing to commit"
          else
            git commit -m "ci: sync rootless manifest hashes after core rebuild"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main \
              && echo "✅ Manifest synced to main" \
              || echo "⚠️  Could not push the synced manifest — installs keep the previous pins until the next rebuild"
          fi

      - name: Cleanup
        if: always()
        run: docker rmi stryker-rootfs stryker-qemu 2>/dev/null || true


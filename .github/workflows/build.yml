name: Build & Update Release
# v1.4.10 build round — makes the frame path observable.
#
# v1.4.9 fixed the relay-table wedge and the device log proves it: the slots
# now recycle ("abandoned after 13 SYN attempts"), the guest gets its address
# ("vec0 = 10.0.2.15/24 via 10.0.2.2") and opxdemon-agentd is confirmed
# listening on 1050 by the guest itself — and "no SYN-ACK" still never stops.
# That message is identical for three different failures: the guest never
# transmits, our frames never reach it, or its frames never reach us. The
# counters that would separate them were not in the daemon, and the one MAC log
# that was ("guest MAC is now ...") stays silent whenever the guest's address
# equals the pinned default, which is the normal case. uml-netd now names the
# first four frames in each direction and reports a guest->host / host->guest
# counter pair whenever either moves, and the console bootstrap asks the guest
# for its real NIC address, link state and whether the gateway answers a ping.
# Nothing about the protocol changes in this round.
#
# v1.4.9 build round — uml-netd no longer wedges its relay table.
#
# RootlessCoreFiles.addIfNeeded() skipped the rootfs entirely, on the
# assumption that build-rootfs.sh could not change what the pin says. That
# stopped being true when the rootfs itself changed, so every phone kept
# booting the guest image it already had: v1.4.7's fixed opxdemon-net.service
# never reached the device, which is why the guest log still printed
# "Ignoring unknown escape sequences" and "Found ordering cycle" on v1.4.8.
# The rootfs is now pinned by a sidecar stamp written at extraction time, so a
# moved pin invalidates the guest image and this costs ONE 366 MB download.
#
# The decisive bug this round came out of that log: uml-netd's forward relays
# were only retired by fwd_finished(), which requires a handshake the guest
# actually completed. A forward whose SYN never got a SYN-ACK stayed in the
# table forever, retransmitting every 500ms. The app opens a new 127.0.0.1:1050
# connection every second or two while the guest boots, so all 48 slots filled
# inside a minute (the device log shows gport=2000..2047 and then no accepted
# connection again) and stayed full: from then on every connect() was closed on
# accept, so a guest that came up healthy one minute later could never be
# reached again. Stalled forwards now give their slot back after 12 SYN
# attempts (6s, twice the 3s the "no SYN-ACK" diagnostic takes) and say so in
# the log. The boot loop's agent-readiness round trip also went from 1500ms to
# 5000ms: that budget has to cover uml-netd's 500ms SYN retransmit plus socat
# forking a shell, and expiring inside it reported a healthy slow guest as a
# silent agent.
#
# v1.4.8 build round — chains a signed APK for the vec0 link-up fix (the guest
# could receive but not transmit: the console bootstrap kept 'ip link set up'
# inside the branch that runs only when the address is missing, and the
# kernel's ip= parameter means it never ran). App-only change, so build.yml
# has to be touched for the chain to fire.
#
# v1.4.5 build round — publishes the 6.5 visuals we could actually place
# (AuroraView behind the engine card, IntroBackgroundView behind the app
# intro, the credits screen reachable from About) plus the guest Wi-Fi entry
# point. build.yml does not watch app/**, so this round exists to chain a
# signed APK for an app-only change.
#
# v1.4.4 build round — publishes the four feature packages ported from
# strykerapp 6.5: wordlists (15 files), wifi/attack (4), wifi/guest (2) and
# hashcrack (3), 5,622 lines in total, which had no counterpart in this app at
# all. Android CI is green on the port; this round exists because build.yml
# does not watch app/**, so an app-only change that needs a shipped APK has to
# touch this file to chain the release — the convention noted below.
#
# Adapted rather than copied verbatim where this app's shape differs: the guest
# flow goes through the single RootlessEngine instead of upstream's Engines /
# GuestEngine split; QemuInstaller returns a boolean here, so its three-way
# Outcome collapses to ok/failed; UsbHostAccess keeps its own permission lock
# because there is no shared manager instance to share upstream's with.
# Core gained overrideEngine/engineOverride (force an engine for one instance
# without repointing the app), guestShare (the path the guest sees) and
# RootlessEngine.missing (names the absent file).
#
# v1.4.3 build round — dashboard UI elements from strykerapp 6.5.
# diffing the two apps showed our dashboard still lacked three things upstream
# had, all of them real affordances rather than cosmetics:
# (1) dash_hero — a full-width accent pill stating the primary action (scan
#     Wi-Fi) once, before the tool grid. Scanning was only another tile, level
#     with Terminal and Metasploit. It shares one handler with the wifi tile so
#     the destination cannot drift.
# (2) vm_btn_copy_log — the boot log on the clipboard. Reading a failed boot out
#     of that log is what this card is for, and before this the only option was
#     screenshotting a scrolling monospace view.
# (3) dash_hero_bg drawable, using this app's own golden accent rather than the
#     upstream blue, so the pill matches the existing theme.
# v1.4.1 build round — UML build-script parity plus the 6.5 handshake-verification fix.
# uml-build.sh now asserts the original developer's full required-symbol list in
# one pass (UML_IOMEM_EMULATION / UML_DMA_EMULATION first: without those two Kconfig
# never offers a device driver, so the fragment looks applied while every driver
# drops out). UML_NET is left out of that list deliberately — it does not exist in
# this tree; grep -rn '^config UML_NET$' --include=Kconfig finds nothing, it is the
# pre-vector name for the same feature and UML_NET_VECTOR is asserted instead.
# Also documents the epoll trap: UML drives its console with epoll and epoll_ctl()
# rejects a regular file with EPERM, so a hand-rolled test must pipe into cat.
# CaptureInfo: a self-contained pcap reader that decides whether a .cap really
# carries an EAPOL handshake or a PMKID. airodump creates handshake-*.cap as soon
# as it sees EAPOL traffic, so accepting the file on sight reported captures that
# aircrack then rejected as having no handshake at all.
# v1.3.9 build round — port of strykerapp 6.5's engine-selection and Wi-Fi UI fixes.
# DeviceCapabilities: probes the device (ABI + memory-page size, RAM, storage,
# network, root) and actually LAUNCHES the UML kernel for up to 12s via UmlProbe,
# then turns that into an ordered engine plan and a recommended engine. A phone
# whose ABI is arm64 but whose memory pages are 16 KB cannot load the kernel and
# only ever says ENOEXEC, so the recommendation has to come from a real start.
# SlidePCheck runs the probe off the UI thread; SlideEngineSelect shows the
# recommendation and stops offering UML once it has been probed and refused.
# Wi-Fi export fix: saved_networks.csv now goes to core.getShareRoot() instead of
# a hardcoded /sdcard path that does not exist under the rootless engines, the
# root fallback appends (>>) instead of truncating (>) on every line, and the
# permission branch no longer NPEs on a null exception message.
# v1.3.7 build round — port of strykerapp 6.5's UML boot fixes.
# (1) Kernel command line now matches what strykerapp 6.5 boots UML with:
# con=null + con0=fd:0,fd:1 pins the kernel console to the process's own
# stdin/stdout and switches every other console channel off, so console output
# cannot escape to a /dev/pts node the app never reads; panic=-1 stops a
# panicking guest from re-exec'ing itself and orphaning its console; the CPU
# count became ncpus=<N> (a bare number is not a kernel option, so it was
# silently dropped and the guest used the host's core count).
# (2) NativeExec pre-flight: every engine binary is checked for presence,
# size and the execute bit before spawn, and exec failures are reported in
# plain language instead of Android's error=13/error=8.
# (3) Stray UML processes left behind by a previous app session are reaped
# via /proc/<pid>/cmdline before a boot starts and after teardown.
# (4) UmlProbe: a bounded 64 MB no-rootfs kernel start that reports
# KERNEL_STARTS/UNPROVEN/BLOCKED, so a failed UML boot says whether this
# phone can run the kernel at all rather than "see the boot log".
# (5) $TMPDIR now honours an existing TMPDIR/TMP/TEMP and /dev/shm or /tmp
# when the device has them, matching 6.5's fallbackTempDir. Chain signed APK publish.
# v1.3.6 build round — v1.3.4 engine fixes plus OTA fallback pin resync
# (initrd/rootfs sha256+size were still pinned to the pre-rebuild core files, so
# an offline-manifest install failed verification and re-downloaded forever).
# Also: the UML console is the kernel's own stdin/stdout (tty0), not the
# announced /dev/pts (tty1); the agent bootstrap is no longer gated on a
# log-text stage detector that could never fire; engine diagnostics are mirrored
# into the dashboard Console pane; the rootfs addresses whichever NIC exists
# (vec0 under UML, eth0 under QEMU) and autologins root on tty0. Chain signed APK publish.

# Signing: release APK is signed with keystore/opx-demon-release.jks via
# gradle.properties (see README → Release signing).
# Exact match with original OPX-Demon rootless-main release
# Custom arm64 kernel: Xiaomi/MIUI USB ep0 maxpacket fix + USB-WiFi drivers
# Docker Buildx GHA cache: mode=max caches ALL layers for fast rebuilds
#
# A successful run also fires the Build APK workflow (workflow_run) for the
# version in app/build.gradle, which publishes the signed APK release.
# Because the APK job is chained to this workflow, an app-only change
# (app/**, README, docs) that still needs a published APK has to run this
# workflow once — the engine layers are cached, so that is a ~5 minute no-op.
#
# 1.1.8 trigger bump: AMOLED layering — true black window + lifted gold surfaces.
#
# UML early-boot fix (v1.2.3): the kernel hard-exited with code 1 right after
# "Warning: tempdir /tmp is not on tmpfs" because Android has no /dev/shm and
# no /tmp, and arch/um/os-Linux/mem.c:create_tmp_file() only retries mkstemp
# when O_TMPFILE fails with EINVAL/EISDIR/EOPNOTSUPP — ENOENT goes straight to
# exit(1). The app now exports TMPDIR to a directory it owns.
#
# UML SIGSYS fix (v1.2.4): the kernel then died at "Run /sbin/init as init
# process" with exit code 159 = 128+SIGSYS. Android installs an unremovable
# seccomp filter in every app process; UML's guest can only survive in
# SECCOMP userspace mode, but the probe and stub gate on close_range(436)
# (kernel 5.9+; Android 10 ships 4.14) and main() calls personality() — none
# whitelisted, so the probe failed, UML silently ran in ptrace mode, and the
# first disallowed guest syscall killed the engine. build-tools/
# uml-android-seccomp.py adds a per-fd close() fallback, skips personality(),
# and clears CLOEXEC on the stub's fd 0; the app now passes seccomp=2 so a
# broken probe is fatal instead of a silent ptrace fallback. Rebuilds
# linux-uml/stub_exe and republishes the APK.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'build-tools/**'
      - 'build-rootfs/**'
      - 'rootless-assets/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Two pushes in a row only need the newest build: the older run would publish
# assets and re-pin the manifest for a commit nobody ships any more.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ══════════════════════════════════════════════════════════════════════
      # ROOTFS: Debian Trixie + pentest tools + opxdemon-agentd
      # ══════════════════════════════════════════════════════════════════════
      - name: Build rootfs
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rootfs-builder
          load: true
          tags: opxdemon-rootfs
          cache-from: type=gha,scope=rootfs
          cache-to: type=gha,scope=rootfs,mode=max

      - name: Extract rootfs + kernel + initrd
        run: |
          docker create --name rootfs-out opxdemon-rootfs
          docker cp rootfs-out:/work/rootfs.imgz ./rootfs.imgz
          docker cp rootfs-out:/work/Image ./Image
          docker cp rootfs-out:/work/initrd.img ./initrd.img
          docker rm rootfs-out
          echo "✅ All rootfs artifacts:"
          ls -lh ./rootfs.imgz ./Image ./initrd.img

      # ══════════════════════════════════════════════════════════════════════
      # QEMU: Cross-compiled patched QEMU binary
      # ══════════════════════════════════════════════════════════════════════
      - name: Build QEMU
        uses: docker/build-push-action@v6
        with:
          context: .
          target: qemu-builder
          load: true
          tags: opxdemon-qemu
          build-args: QEMU_VERSION=11.0.2
          cache-from: type=gha,scope=qemu
          cache-to: type=gha,scope=qemu,mode=max

      - name: Extract QEMU
        run: |
          docker create --name qemu-out opxdemon-qemu /bin/true
          docker cp qemu-out:/opt/qemu-out/qemu-system-aarch64 ./qemu-system-aarch64
          docker cp qemu-out:/opt/qemu-out/libslirp.so ./libslirp.so
          docker rm qemu-out
          echo "✅ QEMU + libslirp:"
          ls -lh ./qemu-system-aarch64 ./libslirp.so

      # ══════════════════════════════════════════════════════════════════════
      # UML: arm64 User-Mode-Linux kernel (rootless engine v2, kernel 7.2)
      # One rootfs boots both engines: QEMU (Image) and UML (linux-uml).
      # ══════════════════════════════════════════════════════════════════════
      - name: Build UML kernel
        uses: docker/build-push-action@v6
        with:
          context: .
          target: uml-builder
          load: true
          tags: opxdemon-uml
          cache-from: type=gha,scope=uml
          cache-to: type=gha,scope=uml,mode=max

      - name: Extract UML kernel
        run: |
          docker create --name uml-out opxdemon-uml /bin/true
          # uml-build.sh writes its artifacts to the OUT dir (/out), not the
          # image root — copying from / would never find them.
          docker run --rm opxdemon-uml ls -lh /out
          docker cp uml-out:/out/linux-uml ./linux-uml
          docker cp uml-out:/out/linux-uml.config ./linux-uml.config
          # uml-build.sh hard-fails without the stub, so a missing/empty copy
          # here is a real pipeline error — fail loudly instead of uploading
          # a 0-byte stub that installs would verify-forever-loop on.
          docker cp uml-out:/out/stub_exe ./stub_exe
          chmod +x ./stub_exe
          docker rm uml-out
          echo "✅ UML engine artifacts:"
          ls -lh ./linux-uml ./linux-uml.config ./stub_exe
          [ -s ./linux-uml ] || { echo "::error::linux-uml is empty"; exit 1; }
          [ -s ./stub_exe ] || { echo "::error::stub_exe is empty"; exit 1; }

      - name: Build uml-netd gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          target: uml-netd-builder
          load: true
          tags: opxdemon-uml-netd
          cache-from: type=gha,scope=uml-netd
          cache-to: type=gha,scope=uml-netd,mode=max

      - name: Extract uml-netd gateway
        run: |
          docker create --name uml-netd-out opxdemon-uml-netd /bin/true
          docker cp uml-netd-out:/out/uml-netd ./uml-netd
          chmod +x ./uml-netd
          docker rm uml-netd-out
          echo "✅ uml-netd gateway:"
          ls -lh ./uml-netd
          [ -s ./uml-netd ] || { echo "::error::uml-netd is empty"; exit 1; }
          file ./uml-netd | grep -q aarch64 \
            || { echo "::error::uml-netd is not an aarch64 binary"; exit 1; }

      # ══════════════════════════════════════════════════════════════════════
      # UPLOAD: split releases
      #   all-core-file      — Debian Trixie engine only (QEMU boot chain:
      #                        qemu, libslirp, Image, initrd, rootfs)
      #   uml-mode-all-file  — UML engine only (linux-uml, stub_exe)
      # The same rootfs boots both engines; the split keeps each release
      # single-engine so installs only pull the files their engine needs.
      # ══════════════════════════════════════════════════════════════════════
      - name: Upload QEMU/Debian-Trixie core to all-core-file release
        # Only publish from main — PR/branch runs are build verification only.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload all-core-file \
            ./Image \
            ./initrd.img \
            ./rootfs.imgz \
            ./qemu-system-aarch64 \
            ./libslirp.so \
            --clobber

          echo ""
          echo "✅ all-core-file (Debian Trixie engine) updated:"
          gh release view all-core-file --json assets \
            --jq '.assets[] | "  \(.name) (\(.size / 1048576 * 100 | round / 100) MB)"'

      - name: Upload UML core to uml-mode-all-file release
        # Only publish from main — PR/branch runs are build verification only.
        # Re-create the release if it does not exist yet (first UML publish).
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view uml-mode-all-file >/dev/null 2>&1 \
            || gh release create uml-mode-all-file \
                 --title "uml-mode-all-file (UML engine)" \
                 --notes "arm64 User-Mode-Linux engine core files (kernel 7.2).\
                    linux-uml + stub_exe boot the same Debian Trixie rootfs.imgz\
                    from the all-core-file release — download that rootfs when\
                    installing the UML engine."
          gh release upload uml-mode-all-file \
            ./linux-uml \
            ./stub_exe \
            ./uml-netd \
            ./linux-uml.config \
            --clobber

          echo ""
          echo "✅ uml-mode-all-file (UML engine) updated:"
          gh release view uml-mode-all-file --json assets \
            --jq '.assets[] | "  \(.name) (\(.size / 1048576 * 100 | round / 100) MB)"'

      # ══════════════════════════════════════════════════════════════════════
      # SYNC: Re-pin rootless hashes in the manifest after every core rebuild.
      # The app downloads these five files at install time and validates them
      # against opx_manifest.json (fetched from raw.githubusercontent.com).
      # If size/sha256 drift from what the pipeline just uploaded, the install
      # downloads a file to 100%, fails verification, and re-downloads the same
      # binary forever. Re-pin from the artifacts on every run.
      # ══════════════════════════════════════════════════════════════════════
      - name: Sync rootless manifest with uploaded artifacts
        # Manifest re-pin only makes sense on main (it pushes to main).
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          mapping = [
              ("qemu-system-aarch64", "qemu"),
              ("Image", "kernel"),
              ("initrd.img", "initrd"),
              ("libslirp.so", "libslirp"),
              ("rootfs.imgz", "rootfs"),
          ]
          with open("opx_manifest.json") as fh:
              manifest = json.load(fh)
          rl = manifest["rootless"]
          # rootless_v2: UML engine (kernel 7.2). Its UML binaries live in the
          # uml-mode-all-file release; the Debian Trixie chain stays in
          # all-core-file. QEMU/libslirp are shared with rootless-main.
          if "rootless_v2" in manifest:
              rv2 = manifest["rootless_v2"]
              v2_map = [
                  ("qemu-system-aarch64", "qemu"),
                  ("libslirp.so", "libslirp"),
                  ("Image", "kernel"),
                  ("initrd.img", "initrd"),
                  ("rootfs.imgz", "rootfs"),
                  ("linux-uml", "uml_kernel", "uml-mode-all-file"),
                  ("stub_exe", "uml_stub", "uml-mode-all-file"),
                  ("uml-netd", "uml_netd", "uml-mode-all-file"),
              ]
              for entry in v2_map:
                  file_name, key = entry[0], entry[1]
                  release = entry[2] if len(entry) > 2 else "all-core-file"
                  if not os.path.exists(file_name) or os.path.getsize(file_name) == 0:
                      print(f"  WARN: {file_name} missing — leaving {key} pins untouched")
                      continue
                  with open(file_name, "rb") as fh:
                      digest = hashlib.sha256(fh.read()).hexdigest()
                  rv2.setdefault(key, {})
                  rv2[key]["sha256"] = digest
                  rv2[key]["size"] = os.path.getsize(file_name)
                  rv2[key]["url"] = (
                      "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
                      + "/releases/download/" + release + "/" + file_name
                  )
                  print(f"  v2 {file_name}: {rv2[key]['size']} bytes, sha256 {digest[:12]}… -> {release}")
          for file_name, key in mapping:
              with open(file_name, "rb") as fh:
                  digest = hashlib.sha256(fh.read()).hexdigest()
              rl[key]["sha256"] = digest
              rl[key]["size"] = os.path.getsize(file_name)
              print(f"  {file_name}: {rl[key]['size']} bytes, sha256 {digest[:12]}…")
          with open("opx_manifest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          PY

          git config user.name "OPX-Aminul"
          git config user.email "305739020+OPX-Aminul@users.noreply.github.com"
          git add opx_manifest.json
          if git diff --cached --quiet; then
            echo "✅ Manifest already in sync — nothing to commit"
          else
            git commit -m "ci: sync rootless manifest hashes after core rebuild"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main \
              && echo "✅ Manifest synced to main" \
              || echo "⚠️  Could not push the synced manifest — installs keep the previous pins until the next rebuild"
          fi

      - name: Cleanup
        if: always()
        run: docker rmi opxdemon-rootfs opxdemon-qemu opxdemon-uml 2>/dev/null || true

